; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[env:d1_mini]
board = d1_mini
upload_speed = 921600
framework = arduino

board_build.f_cpu  = 160000000L
;board_build.f_cpu = 80000000L
; note, espressive$3.0.0+ does not work properly with FastLED

platform = espressif8266@2.6.3
;platform = espressif8266_stage
;platform = https://github.com/platformio/platform-espressif8266.git#feature/stage

board_build.flash_mode = dout

; Fix for register warnings in FastLED with latest compilers
build_flags = -Wno-register
; Fixed callback port for Arduino OTA. Change it if 55910 is already in use.
upload_flags = --host_port=55910

; Stamp src/build_version.h with the git hash and local build time.
extra_scripts = pre:scripts/build_version.py
